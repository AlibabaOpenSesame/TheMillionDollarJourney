<?xml version="1.0" encoding="UTF-8"?>
<!--
  Static share card source for public/og.png (1200x630).
  Render: rsvg-convert -w 1200 -h 630 scripts/og/og.svg -o public/og.png
  Fonts: Noto Sans CJK SC (title) + Geist Mono (Latin/digits). No account value or date by design.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#191b1e" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0f1012" stop-opacity="0"/>
      <stop offset="1" stop-color="#08090b" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="goldRuleL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="316" y2="0">
      <stop offset="0" stop-color="#c9a57a" stop-opacity="0"/>
      <stop offset="1" stop-color="#c9a57a" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="goldRuleR" gradientUnits="userSpaceOnUse" x1="884" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#c9a57a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c9a57a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jadeLine" gradientUnits="userSpaceOnUse" x1="188" y1="0" x2="1008" y2="0">
      <stop offset="0" stop-color="#35d490" stop-opacity="0.25"/>
      <stop offset="0.7" stop-color="#35d490" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#54e6a8" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="jadeGlow">
      <stop offset="0" stop-color="#35d490" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#35d490" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0f1012"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Title rules -->
  <line x1="0" y1="156" x2="316" y2="156" stroke="url(#goldRuleL)" stroke-width="1.5"/>
  <circle cx="322" cy="156" r="5" fill="none" stroke="#c9a57a" stroke-width="1.5"/>
  <circle cx="322" cy="156" r="1.8" fill="#c9a57a"/>
  <line x1="884" y1="156" x2="1200" y2="156" stroke="url(#goldRuleR)" stroke-width="1.5"/>
  <circle cx="878" cy="156" r="5" fill="none" stroke="#c9a57a" stroke-width="1.5"/>
  <circle cx="878" cy="156" r="1.8" fill="#c9a57a"/>

  <!-- Title -->
  <text x="600" y="176" text-anchor="middle" fill="#c9a57a" font-family="Noto Sans CJK SC" font-weight="500" font-size="54" letter-spacing="18">百万美元之路</text>
  <text x="600" y="210" text-anchor="middle" fill="#bf9a70" font-family="Geist Mono" font-weight="500" font-size="17" letter-spacing="7">THE MILLION DOLLAR JOURNEY</text>

  <!-- Route -->
  <text x="600" y="362" text-anchor="middle" fill="#f3f5f7" font-family="Geist Mono" font-weight="300" font-size="118" letter-spacing="6">$1K → $1M</text>

  <!-- Jade progress line -->
  <line x1="188" y1="425" x2="1008" y2="425" stroke="url(#jadeLine)" stroke-width="2"/>
  <circle cx="188" cy="425" r="3.5" fill="#35d490"/>
  <circle cx="1008" cy="425" r="46" fill="url(#jadeGlow)"/>
  <circle cx="1008" cy="425" r="11" fill="none" stroke="#54e6a8" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="1008" cy="425" r="5" fill="#eafff5"/>

  <!-- Motto -->
  <text x="600" y="518" text-anchor="middle" fill="#e8ecef" font-family="Geist Mono" font-weight="400" font-size="26" letter-spacing="2">One Portfolio. One Journey.</text>
</svg>
